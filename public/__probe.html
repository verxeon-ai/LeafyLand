<!doctype html>
<html>
<head><meta charset="utf-8"><title>probe</title></head>
<body>
<pre id="out">pending</pre>
<div id="host" style="position:fixed;left:-20000px;top:0;"></div>
<script>
const SIZES = [
  ['very-short-small', 320, 480],
  ['iphone-se1',       320, 568],
  ['android-small',    360, 640],
  ['iphone-se2',       375, 667],
  ['iphone-x',         375, 812],
  ['iphone-14',        390, 844],
  ['pixel-8',          412, 870],
  ['iphone-xr',        414, 896],
  ['iphone-16-max',    430, 932],
  ['android-tall',     360, 740],
  ['narrow-tall',      344, 882],
  ['land-se',          667, 375],
  ['land-16-9',        740, 360],
  ['land-iphone14',    844, 390],
  ['land-16-max',      932, 430],
];

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function measure(frame) {
  const d = frame.contentDocument;
  const w = frame.contentWindow;
  const de = d.documentElement;
  const q = (s) => d.querySelector(s);
  const rect = (el) => el ? el.getBoundingClientRect() : null;
  const n = (v) => v === null || v === undefined ? null : Math.round(v * 10) / 10;

  const topbar = rect(q('.auth-topbar'));
  const hero = rect(q('.auth-hero'));
  const card = rect(q('.auth-card-wrap'));
  const legal = rect(q('.auth-legal'));

  // Every control the user must be able to see and reach.
  const controls = [...d.querySelectorAll('.auth-mobile input, .auth-mobile button, .auth-mobile a')];
  let cutBottom = 0, cutTop = 0, offscreen = [];
  for (const el of controls) {
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) continue;
    const below = r.bottom - w.innerHeight;
    const above = -r.top;
    if (below > cutBottom) cutBottom = below;
    if (above > cutTop) cutTop = above;
    if (below > 0.5 || above > 0.5) {
      offscreen.push((el.textContent || el.type || el.tagName).trim().slice(0, 18));
    }
  }

  return {
    signup: !!q('.auth-page.is-signup'),
    vOver: n(de.scrollHeight - w.innerHeight),
    hOver: n(de.scrollWidth - w.innerWidth),
    topGap: n(topbar ? topbar.top : null),
    heroH: n(hero ? hero.height : 0),
    heroShown: hero ? getComputedStyle(q('.auth-hero')).display !== 'none' : false,
    cardTop: n(card ? card.top : null),
    cardBot: n(card ? card.bottom : null),
    botGap: n(legal ? w.innerHeight - legal.bottom : null),
    cutBottom: n(cutBottom),
    cutTop: n(cutTop),
    offscreen,
  };
}

(async () => {
  const host = document.getElementById('host');
  const out = [];

  for (const [name, w, h] of SIZES) {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:' + w + 'px;height:' + h + 'px;border:0;display:block;';
    f.src = '/login';
    host.appendChild(f);

    await new Promise((res) => { f.onload = res; setTimeout(res, 15000); });

    // Wait for hydration: the tab button only responds once React attaches.
    let tab = null;
    for (let i = 0; i < 60; i++) {
      const d = f.contentDocument;
      tab = [...d.querySelectorAll('button')].find(b => b.textContent.trim() === 'Sign Up');
      if (tab && d.querySelector('.auth-card-wrap')) break;
      await sleep(100);
    }
    await sleep(400);

    const login = measure(f);

    let signup = null;
    if (tab) {
      for (let attempt = 0; attempt < 8; attempt++) {
        const d = f.contentDocument;
        const t = [...d.querySelectorAll('button')].find(b => b.textContent.trim() === 'Sign Up');
        if (t) t.click();
        await sleep(250);
        if (d.querySelector('.auth-page.is-signup')) break;
      }
      await sleep(300);
      signup = measure(f);
    }

    out.push({ name, vp: w + 'x' + h, login, signup });
    f.remove();
  }

  document.getElementById('out').textContent = 'RESULTS_JSON:' + JSON.stringify(out);
  document.title = 'done';
})();
</script>
</body>
</html>
